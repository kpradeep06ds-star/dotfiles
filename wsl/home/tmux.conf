set -g mouse on                                   # scroll / select panes with the mouse
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"  # true colour for Neovim
set -sg escape-time 10                            # no lag on <Esc> in Neovim
set -g focus-events on                            # gitsigns / autoread in Neovim
set -g base-index 1                               # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000

# Catppuccin-style status bar
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g window-status-current-style "bg=#89b4fa,fg=#11111b,bold"
