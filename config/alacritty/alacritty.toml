[general]
live_config_reload = true
import = [
    "~/.config/alacritty/wallust-colors.toml"
]

[window]
padding = { x = 12, y = 10 }
dynamic_padding = true
decorations = "None"
opacity = 0.92

[font]
size = 12

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[scrolling]
history = 10000
multiplier = 3

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 500
blink_timeout = 5

[selection]
save_to_clipboard = true
