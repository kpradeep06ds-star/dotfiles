general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = screenshot

    blur_passes = 4
    blur_size = 7

    brightness = 0.55
    contrast = 0.95
    vibrancy = 0.15
}

/* Large clock */
label {
    monitor =

    text = $TIME
    font_family = Noto Sans
    font_size = 72

    color = rgba(205, 214, 244, 1.0)

    position = 0, 170

    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.45)
}

/* Date */
label {
    monitor =

    text = cmd[update:60000] date "+%A, %d %B"
    font_family = Noto Sans
    font_size = 18

    color = rgba(186, 194, 222, 0.95)

    position = 0, 105

    halign = center
    valign = center
}

/* User */
label {
    monitor =

    text =   $USER
    font_family = JetBrainsMono Nerd Font
    font_size = 15

    color = rgba(137, 180, 250, 1.0)

    position = 0, 25

    halign = center
    valign = center
}

/* Password box */
input-field {
    monitor =

    size = 340, 54
    outline_thickness = 2

    dots_size = 0.20
    dots_spacing = 0.25
    dots_center = true

    outer_color = rgba(137, 180, 250, 0.90)
    inner_color = rgba(49, 50, 68, 0.78)
    font_color = rgba(205, 214, 244, 1.0)

    font_family = Noto Sans

    placeholder_text = <i>Password</i>

    fade_on_empty = false

    rounding = 14

    position = 0, -55

    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.40)
}
